[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signet-harness"
version = "0.1.0"
description = "Team Signet's shared experiment harness: one OpenRouter client, pinned models, one JSONL log format, four headline numbers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
signet = "signet_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
